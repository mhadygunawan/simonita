<!doctype html>
<html lang="id" class="w-full h-full m-0 p-0 overflow-x-hidden">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/simonita.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SIMONITA - Sistem Monitoring Opini dan Berita</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              customsNavy: '#0D2C5C',
              customsGold: '#F59E0B'
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      @keyframes marquee {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
      }
      .animate-marquee {
        display: inline-block;
        white-space: nowrap;
        animation: marquee 25s linear infinite;
      }
    </style>
  </head>
  <body class="w-full h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased m-0 p-0">
    <div id="root" class="w-full h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
